server.port=${PORT:8080}
server.address=0.0.0.0
spring.profiles.active=test
spring.application.name=spotFinder-backend

# Spring Data JPA Configuration
spring.jpa.show-sql=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spotfinder?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
##
#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#spring.jpa.hibernate.naming.physical-strategy=com.spotfinderbackend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
authorization.jwt.expiration.days=7

# Plate Recognizer (ALPR) Configuration
platerecognizer.api-url=${PLATE_RECOGNIZER_URL:https://api.platerecognizer.com/v1/plate-reader/}
platerecognizer.api-token=${PLATE_RECOGNIZER_TOKEN:}
# Optional region hint(s), comma-separated (e.g. "pe" for Peru). Empty = auto-detect.
platerecognizer.regions=${PLATE_RECOGNIZER_REGIONS:pe}
# When true, fall back to the stub plate if no token is set or the API call fails.
platerecognizer.stub-fallback=${PLATE_RECOGNIZER_STUB_FALLBACK:true}

# CORS Configuration
spring.graphql.cors.allowed-origins=https://front-opensource.web.app
spring.graphql.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.graphql.cors.allowed-headers=Origin,Accept,X-Requested-With,Content-Type,Authorization,Access-Control-Request-Method,Access-Control-Request-Headers
spring.graphql.cors.allow-credentials=true